[project]
name = "rocket-lantern"
version = "1.5.0"
description = "Capture locale et analyse des données de match Rocket League avec Qt"
readme = "README.md"
requires-python = ">=3.13"
dependencies = ["PySide6>=6.10,<7"]

[project.scripts]
rocket-lantern = "rocket_lantern.app:main"

[dependency-groups]
build = ["pyinstaller>=6.16,<7"]
dev = ["pytest>=8,<10", "ruff>=0.12,<1"]

[build-system]
requires = ["hatchling>=1.27,<2"]
build-backend = "hatchling.build"

[tool.pytest.ini_options]
testpaths = ["tests"]

[tool.ruff]
line-length = 100
target-version = "py313"

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
