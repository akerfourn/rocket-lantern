name: Windows build

on:
  push:
  pull_request:
  workflow_dispatch:
    inputs:
      release_tag:
        description: Existing stable tag to build and publish (optional)
        required: false
        type: string

permissions:
  contents: read

jobs:
  checks:
    runs-on: windows-2022
    timeout-minutes: 25
    outputs:
      stable_tag: ${{ steps.release.outputs.stable }}
      release_tag: ${{ steps.release.outputs.tag }}
      publish: ${{ steps.release.outputs.stable == 'true' || steps.preview.outputs.publish == 'true' }}
      prerelease: ${{ steps.preview.outputs.prerelease }}
      target_tag: ${{ steps.release.outputs.tag || steps.preview.outputs.tag }}
    defaults:
      run:
        shell: pwsh
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ inputs.release_tag || github.sha }}
          fetch-depth: 0
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Install dependencies
        run: uv sync --locked
      - name: Test and lint
        run: |
          uv run --locked python scripts/compile-translations.py
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked pytest -q
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          uv run --locked ruff format --check .
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
      - name: Identify stable version tag
        id: release
        env:
          REQUESTED_TAG: ${{ inputs.release_tag }}
        run: |
          $pattern = '^v(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)\.(0|[1-9][0-9]*)$'
          $tag = ''
          if ($env:REQUESTED_TAG) {
            if ($env:REQUESTED_TAG -cnotmatch $pattern) {
              throw 'The requested release tag must be a stable vMAJOR.MINOR.PATCH tag.'
            }
            $tag = $env:REQUESTED_TAG
          } elseif ($env:GITHUB_REF_TYPE -eq 'tag') {
            $tag = $env:GITHUB_REF_NAME
          }
          $stable = $tag -cmatch $pattern
          "stable=$($stable.ToString().ToLowerInvariant())" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          "tag=$tag" | Add-Content -LiteralPath $env:GITHUB_OUTPUT
          if ($stable) {
            $notes = "releases/release-$($tag.Substring(1)).md"
            if (-not (Test-Path -LiteralPath $notes -PathType Leaf)) {
              throw "Missing release notes: $notes"
            }
            if ([string]::IsNullOrWhiteSpace((Get-Content -LiteralPath $notes -Raw))) {
              throw "Empty release notes: $notes"
            }
          }

      - name: Detect changed prerelease version
        if: github.event_name == 'push' && github.ref_type == 'branch'
        id: preview
        env:
          PUSH_BEFORE: ${{ github.event.before }}
        run: uv run --locked python scripts/detect-prerelease.py

  windows:
    needs: checks
    if: needs.checks.outputs.publish == 'true'
    runs-on: windows-2022
    timeout-minutes: 25
    defaults:
      run:
        shell: pwsh
    env:
      RELEASE_TAG: ${{ needs.checks.outputs.target_tag }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.prerelease == 'true' && github.sha || needs.checks.outputs.release_tag }}
      - uses: astral-sh/setup-uv@v6
        with:
          version: "0.8.22"
      - name: Install build dependencies
        run: uv sync --locked --group build
      - name: Verify tag matches application version
        run: |
          $version = uv run --locked python -c "from importlib.metadata import version; print(version('rocket-lantern'))"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          $declared = uv run --locked python -c "import tomllib; print(tomllib.load(open('pyproject.toml', 'rb'))['project']['version'])"
          if ($LASTEXITCODE -ne 0) { exit $LASTEXITCODE }
          if ($env:RELEASE_TAG -cne "v$declared") {
            throw "Version tag must match pyproject.toml: expected v$version"
          }
      - name: Install Inno Setup
        run: |
          $installer = Join-Path $env:RUNNER_TEMP 'innosetup.exe'
          Invoke-WebRequest 'https://github.com/jrsoftware/issrc/releases/download/is-6_7_3/innosetup-6.7.3.exe' -OutFile $installer
          if ((Get-AuthenticodeSignature $installer).Status -ne 'Valid') {
            throw 'Invalid Inno Setup signature'
          }
          $directory = Join-Path $env:RUNNER_TEMP 'InnoSetup'
          $process = Start-Process $installer -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', '/PORTABLE=1', "/DIR=$directory" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Inno Setup installation failed' }
      - name: Build executable and installer
        run: ./scripts/build-windows.ps1 -IsccPath "$env:RUNNER_TEMP\InnoSetup\ISCC.exe"
      - name: Test silent installation
        run: |
          $installer = Get-ChildItem dist/installers/RocketLantern-*-setup.exe | Select-Object -First 1
          $directory = Join-Path $env:RUNNER_TEMP 'RocketLantern-installed'
          $process = Start-Process $installer.FullName -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART', '/SP-', "/DIR=$directory" -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Silent installation failed' }
          $process = Start-Process "$directory\RocketLantern.exe" -ArgumentList '--smoke-test' -WindowStyle Hidden -PassThru
          if (-not $process.WaitForExit(30000)) {
            $process.Kill()
            throw 'Installed application timed out'
          }
          if ($process.ExitCode -ne 0) { throw 'Installed application failed' }
          $process = Start-Process "$directory\unins000.exe" -ArgumentList '/VERYSILENT', '/SUPPRESSMSGBOXES', '/NORESTART' -Wait -PassThru
          if ($process.ExitCode -ne 0) { throw 'Silent uninstall failed' }
      - name: Upload Windows packages
        uses: actions/upload-artifact@v4
        with:
          name: RocketLantern-windows-x64
          path: dist/installers/RocketLantern-*
          if-no-files-found: error
          retention-days: 30

  release:
    needs: [checks, windows]
    if: needs.checks.outputs.publish == 'true'
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: write
    concurrency:
      group: publish-release-${{ needs.checks.outputs.target_tag }}
      cancel-in-progress: false
    env:
      GH_TOKEN: ${{ github.token }}
      GH_REPO: ${{ github.repository }}
      RELEASE_TAG: ${{ needs.checks.outputs.target_tag }}
      PRERELEASE: ${{ needs.checks.outputs.prerelease }}
      RELEASE_COMMIT: ${{ github.sha }}
    steps:
      - uses: actions/checkout@v4
        with:
          ref: ${{ needs.checks.outputs.prerelease == 'true' && github.sha || needs.checks.outputs.release_tag }}
      - name: Download tested Windows packages
        uses: actions/download-artifact@v4
        with:
          name: RocketLantern-windows-x64
          path: dist/installers
      - name: Publish GitHub release
        shell: bash
        run: |
          set -euo pipefail
          version="${RELEASE_TAG#v}"
          notes="releases/release-${version}.md"
          create_options=(--verify-tag)
          edit_options=(--prerelease=false)
          package_version="$version"
          if [ "${PRERELEASE:-false}" = true ]; then
            package_version=$(python3 -c 'import re, sys; print(re.sub(r"[-.]?(alpha|beta|a|b|rc)[-.]?([0-9]+)$", lambda m: {"alpha": "a", "beta": "b"}.get(m[1], m[1]) + str(int(m[2])), sys.argv[1]))' "$version")
            notes="releases/prerelease.md"
            create_options=(--target "$RELEASE_COMMIT" --prerelease --latest=false)
            edit_options=(--prerelease=true --latest=false)
          fi
          installer="dist/installers/RocketLantern-${package_version}-windows-x64-setup.exe"
          portable="dist/installers/RocketLantern-${package_version}-windows-x64-portable.zip"
          test -s "$notes"
          test -s "$installer"
          test -s "$portable"
          if gh release view "$RELEASE_TAG" > /dev/null 2>&1; then
            gh release upload "$RELEASE_TAG" "$installer" "$portable" --clobber
            gh release edit "$RELEASE_TAG" --title "RocketLantern ${version}" \
              --notes-file "$notes" --draft=false "${edit_options[@]}"
          else
            gh release create "$RELEASE_TAG" "$installer" "$portable" \
              "${create_options[@]}" --title "RocketLantern ${version}" --notes-file "$notes"
          fi
